name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'         # git tag v0.5.0 时触发

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/myknowledge
    permissions:
      id-token: write   # 用 OIDC 做信任发布，无需 API token

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 前端守门：发布前必须能构建出有效 standalone（后端静态服务加载它），
      # 防止过期的 index.standalone.html 被打进 PyPI 包分发
      - name: Install frontend deps (jsdom/turndown for roundtrip test)
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend build + check
        working-directory: frontend
        run: |
          python3 build.py
          python3 check_build.py

      # 版本一致性守门（L2 CI 兜底，与 .githooks/pre-push 同规则，另加 tag 版本校验）：
      # 1) backend/__version__.py == desktop/package.json（发版时两侧必须同步）
      # 2) git tag 版本（去掉 v 前缀）== __version__.py（防止发错版本号的内容）
      # 本地 hook 可被 --no-verify 跳过，发布前在此强制校验。
      - name: Version consistency check
        run: |
          py_ver="$(sed -n 's/^__version__ *= *"\([^"]*\)" */\1/p' backend/__version__.py | head -1)"
          js_ver="$(sed -n 's/^  *"version" *: *"\([^"]*\)" *,*$/\1/p' desktop/package.json | head -1)"
          tag_ver="${GITHUB_REF_NAME#v}"
          fail=0
          [ -n "$py_ver" ] || { echo "✗ 无法解析 backend/__version__.py"; fail=1; }
          [ -n "$js_ver" ] || { echo "✗ 无法解析 desktop/package.json"; fail=1; }
          [ "$py_ver" = "$js_ver" ] || { echo "✗ 版本不一致: __version__.py=$py_ver vs package.json=$js_ver"; fail=1; }
          [ "$py_ver" = "$tag_ver" ] || { echo "✗ tag 版本与代码版本不一致: tag=$tag_ver vs __version__.py=$py_ver"; fail=1; }
          [ "$fail" -eq 0 ] && echo "✓ 版本一致: v$py_ver (tag=$tag_ver)" || exit 1

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
