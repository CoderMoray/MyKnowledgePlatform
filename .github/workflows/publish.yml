name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'         # git tag v0.5.0 时触发

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/myknowledge
    permissions:
      id-token: write   # 用 OIDC 做信任发布，无需 API token

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
