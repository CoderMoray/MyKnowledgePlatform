name: Frontend Build Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Validate standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps (jsdom/turndown for roundtrip test)
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build standalone (build.py)
        working-directory: frontend
        run: python3 build.py

      - name: Validate build (check_build.py — 构建忠实性检查)
        working-directory: frontend
        run: python3 check_build.py
