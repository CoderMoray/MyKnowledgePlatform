# MyKnowledge 桌面壳 — electron-builder 配置
# 产出：MyKnowledge-0.7.0-arm64.dmg / .zip（Apple Silicon）
#       MyKnowledge-0.7.0-x64.dmg / .zip（Intel）

appId: com.myknowledge.desktop
productName: MyKnowledge
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - loading.html
  - package.json
# 后端（PyInstaller onedir 目录）打进 app 的 Resources/（main.js 从 process.resourcesPath 定位）
extraResources:
  - from: ../dist-backend/myknowledge-backend
    to: myknowledge-backend
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # 自定义图标：desktop/assets/icon.icns（用 scripts/make-icon.sh 生成）
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
dmg:
  title: MyKnowledge ${version}
  artifactName: MyKnowledge-${version}-${arch}.${ext}
npmRebuild: false
