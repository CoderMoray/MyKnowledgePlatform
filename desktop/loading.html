<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <title>MyKnowledge</title>
  <!--
    桌面 app 的唯一加载动画（视觉与前端 splash 一致）：
    进度 0→100%，完成态（绿色条）后通过 preload 的 __mykLoadingDone__ 通知
    主进程切换主界面。前端 splash 由 __MYK_APP_MODE__ 隐藏，网页端不受影响。
  -->
  <style>
    :root {
      --bg-primary: #fafafa;
      --accent-gradient: linear-gradient(135deg, #818cf8, #6366f1);
      --text-primary: #111827;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1e;
        --accent-gradient: linear-gradient(135deg, #a5b4fc, #818cf8);
        --text-primary: #f5f5f7;
        color-scheme: dark;
      }
    }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      gap: 16px;
      user-select: none;
    }
    .splash__logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--accent-gradient);
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash__title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .splash__bar {
      width: 180px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      margin-top: 8px;
    }
    .splash__bar-fill {
      height: 3px;
      width: 0%;
      border-radius: 2px;
      background: var(--accent-gradient);
      transition: width 0.3s ease, height 0.6s ease, border-radius 0.6s ease, background 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 100% 完成态：居中扩展，Apple R 角，绿色（与前端 splash--done 一致） */
    .splash__bar-fill--done {
      width: 100% !important;
      height: 26px !important;
      border-radius: 8px !important;
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
    }
    .splash__bar-text {
      display: none;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      animation: splash-text-in 0.3s ease both;
    }
    /* 文本延迟到绿条展开（height 3px→26px，0.6s）完成后再显示，
       避免在低高度下被挤压/错位。仅 animation-delay 推迟开始；
       不另设 opacity:0（与 animation: ... both 冲突会覆盖 to 态 → 文本永久不可见） */
    .splash__bar-fill--done .splash__bar-text {
      display: block;
      animation-delay: 0.55s;
    }
    @keyframes splash-text-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="splash__logo">M</div>
    <div class="splash__title">MyKnowledge</div>
    <div class="splash__bar">
      <div class="splash__bar-fill" id="bar">
        <span class="splash__bar-text">初始化完成</span>
      </div>
    </div>
  </div>
  <script>
    // 进度 0→100%（约 7s，与后端冷启动同步）；完成态后通知主进程切换
    const bar = document.getElementById("bar");
    let p = 0;
    const timer = setInterval(() => {
      p = Math.min(100, p + 2 + Math.random() * 5);
      bar.style.width = p + "%";
      if (p >= 100) {
        clearInterval(timer);
        bar.classList.add("splash__bar-fill--done");
        // 等绿条展开动画（height 3px→26px, 0.6s transition）真正结束后再切主界面，
        // 避免绿条被截断在展开中途（此前固定 400ms < 600ms 动画时长 → 截断）。
        // transitionend 事件精确；加超时兜底防止事件未触发。
        let switched = false;
        const doSwitch = () => {
          if (switched) return;
          switched = true;
          bar.removeEventListener("transitionend", onExpandEnd);
          // 关键：绿条展开(0.6s)后，文本「初始化完成」还要 animation-delay 0.55s +
          // 0.3s 淡入才完全显示（共 0.85s）。若绿条一展开就通知切换，0.6s 时文本
          // opacity≈0，主界面切走 → 用户看不到文本。
          // 浏览器直接打开（无 preload 注入 __mykLoadingDone__）不切换所以正常；
          // 桌面 app 里 preload 注入后会触发切换，必须等文本显示完再切。
          // 实测（真实 preload + contextIsolation）：绿条展开后仅等 0.35s 时文本虽已
          // opacity=1，但切换紧随其后（0.95s），用户只有 ~0.1s 看到文本，感知=没显示。
          // 因此给文本足够的停留时间：绿条展开后延迟 1.1s 再切，文本完整可见约 0.85s。
          setTimeout(() => {
            if (window.__mykLoadingDone__) window.__mykLoadingDone__();
          }, 1100);
        };
        const onExpandEnd = (e) => {
          if (e.propertyName === "height") doSwitch();
        };
        bar.addEventListener("transitionend", onExpandEnd);
        setTimeout(doSwitch, 900); // 兜底：0.6s 动画 + 缓冲
      }
    }, 150);
  </script>
</body>
</html>
